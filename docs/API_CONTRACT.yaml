openapi: 3.0.3
info:
  title: Manufacturing AI Cost Intelligence API
  version: 1.1.0
  description: >
    API contract for the Manufacturing AI Cost Intelligence & Autonomous
    Optimization Platform.

    Field types and persistence semantics follow DATABASE_SCHEMA.md. Cost values
    are always labelled with their provenance (ACTUAL, ESTIMATED, FORECAST,
    SIMULATED, UNAVAILABLE) so they are never presented interchangeably.

servers:
  - url: /api/v1

tags:
  - name: System
  - name: AI Execution
  - name: Costs
  - name: Budgets
  - name: Forecasts
  - name: Anomalies
  - name: Optimization
  - name: Models
  - name: Workloads
  - name: Organization
  - name: Policies
  - name: Governance

paths:

  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Service is alive

  /ready:
    get:
      tags: [System]
      summary: Readiness check
      responses:
        "200":
          description: Service and required dependencies are ready
        "503":
          description: Service is not ready

  /ai/execute:
    post:
      tags: [AI Execution]
      summary: Execute a cost-aware AI workload
      description: >
        Routes an AI request through authentication, input guardrails, budget
        and policy checks, model selection, context/tool guardrails and the
        configured model gateway.

        The budget policy outcome is returned in execution_plan.budget_status.
        ALLOW and DOWNGRADE return 200. REQUIRE_APPROVAL returns 202 with an
        approval record. BLOCK returns 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIExecutionRequest"
      responses:
        "200":
          description: Successful AI execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIExecutionResponse"
        "202":
          description: >
            Execution requires approval before it can proceed
            (budget_status = REQUIRE_APPROVAL, or a high-risk action per
            SECURITY.md section 14).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          $ref: "#/components/responses/PolicyConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/InternalError"

  /cost/summary:
    get:
      tags: [Costs]
      summary: Get current cost summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantId"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /cost/by-model:
    get:
      tags: [Costs]
      summary: Get cost grouped by model
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantId"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Model cost breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /cost/by-agent:
    get:
      tags: [Costs]
      summary: Get cost grouped by agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantId"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Agent cost breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /cost/by-plant:
    get:
      tags: [Costs]
      summary: Get cost grouped by plant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Plant cost breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /cost/trend:
    get:
      tags: [Costs]
      summary: Get historical cost trend
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantId"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: granularity
          in: query
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
      responses:
        "200":
          description: Historical cost trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostTrend"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Budget list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Budgets]
      summary: Create a budget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCreate"
      responses:
        "201":
          description: Budget created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /budgets/{id}:
    patch:
      tags: [Budgets]
      summary: Update a budget
      description: >
        Budget changes are auditable events (SECURITY.md section 16).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /budgets/status:
    get:
      tags: [Budgets]
      summary: Get budget status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Budget status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetStatusList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /forecasts:
    get:
      tags: [Forecasts]
      summary: Get AI cost forecast
      security:
        - bearerAuth: []
      parameters:
        - name: horizon_days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Forecast result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /anomalies:
    get:
      tags: [Anomalies]
      summary: List detected anomalies
      security:
        - bearerAuth: []
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Anomaly list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /optimization/recommendations:
    get:
      tags: [Optimization]
      summary: List optimization recommendations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, APPLIED, ROLLED_BACK]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Optimization recommendation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationRecommendationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /optimization/analyze:
    post:
      tags: [Optimization]
      summary: Generate an optimization analysis
      description: >
        Runs asynchronously. The returned recommendation_id can be polled on
        /optimization/recommendations. Results are always ESTIMATED or
        SIMULATED and never constitute a production change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizationAnalyzeRequest"
      responses:
        "202":
          description: Optimization analysis accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationAnalyzeAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /optimization/{id}/approve:
    post:
      tags: [Optimization]
      summary: Approve optimization recommendation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OptimizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Recommendation approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationRecommendation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PolicyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /optimization/{id}/apply:
    post:
      tags: [Optimization]
      summary: Apply approved optimization policy
      description: >
        Creates and activates a new routing policy version. Requires the
        recommendation to be APPROVED and to have passed policy validation.
        Returns 409 if either condition is unmet.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OptimizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizationApplyRequest"
      responses:
        "200":
          description: Policy activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationApplyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PolicyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /optimization/{id}/rollback:
    post:
      tags: [Optimization]
      summary: Roll back an applied optimization policy
      description: >
        Version-based rollback required by AI_DEVELOPMENT_RULES.md section 45.
        Reactivates superseded_policy_id. Policies are never deleted; the rolled
        back version is retained and marked ROLLED_BACK.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OptimizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizationRollbackRequest"
      responses:
        "200":
          description: Policy rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationRollbackResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PolicyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /models:
    get:
      tags: [Models]
      summary: List registered models
      security:
        - bearerAuth: []
      parameters:
        - name: capability
          in: query
          description: Matches models.capability in DATABASE_SCHEMA.md section 11.
          schema:
            type: string
            enum: [text, vision, multimodal, embedding, speech, coding, reasoning]
        - name: modality
          in: query
          description: Matches models.modality in DATABASE_SCHEMA.md section 11.
          schema:
            type: string
            enum: [text, image, multimodal, structured]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Model registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /models/{id}:
    patch:
      tags: [Models]
      summary: Update registry metadata for a model
      description: >
        Covers enable/disable and configurable cost/quality metadata. Every
        change is auditable (SECURITY.md section 16) and recorded in
        model_registry_history (DATABASE_SCHEMA.md section 21).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: Model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /workloads:
    get:
      tags: [Workloads]
      summary: List AI workloads
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantId"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Workload list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /agents:
    get:
      tags: [Workloads]
      summary: List agents
      description: >
        Required to resolve agent identifiers returned by /cost/by-agent and to
        populate scope_id for AGENT-scoped budgets.
      security:
        - bearerAuth: []
      parameters:
        - name: workload_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /plants:
    get:
      tags: [Organization]
      summary: List plants
      description: >
        Required to populate scope_id for PLANT-scoped budgets and to resolve
        plant identifiers returned by /cost/by-plant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Plant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /departments:
    get:
      tags: [Organization]
      summary: List departments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /policies:
    get:
      tags: [Policies]
      summary: List active and historical routing policies
      security:
        - bearerAuth: []
      parameters:
        - name: workload_type
          in: query
          schema:
            type: string
            enum: [quality_check, predictive_maintenance, supply_chain]
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_APPROVAL, CANARY, ACTIVE, SUPERSEDED, ROLLED_BACK]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Routing policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingPolicyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /governance/approvals:
    get:
      tags: [Governance]
      summary: List approval requests
      description: >
        Backs every approval path: the REQUIRE_APPROVAL budget outcome
        (SECURITY.md section 13), high-risk manufacturing actions
        (SECURITY.md section 14) and high-risk tool use (SECURITY.md section 11).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        - name: resource_type
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /governance/approvals/{id}/decide:
    post:
      tags: [Governance]
      summary: Approve or reject a pending approval request
      description: >
        The decision is made by an authorized human principal. A model result
        can never satisfy this endpoint on its own behalf.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Approval decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PolicyConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

  /governance/audit:
    get:
      tags: [Governance]
      summary: Search audit events
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: request_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/InternalError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PlantId:
      name: plant_id
      in: query
      schema:
        type: string

    DepartmentId:
      name: department_id
      in: query
      schema:
        type: string

    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time

    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    OptimizationId:
      name: id
      in: path
      required: true
      schema:
        type: string

    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: >
            Safe human-readable summary. Never contains stack traces, internal
            exception detail or secrets.
        request_id:
          type: string
        details:
          type: object
          description: Field-level validation detail where applicable.

    PageInfo:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    InputRef:
      type: object
      description: >
        Reference to an input artifact held in object storage. Large images and
        documents are never inlined; SQLite stores references only
        (SECURITY.md section 17, DATABASE_SCHEMA.md section 23).
      required:
        - ref
        - content_type
      properties:
        ref:
          type: string
          description: Opaque server-resolvable object storage reference.
        content_type:
          type: string
        size_bytes:
          type: integer
        classification:
          type: string
          description: >
            Data classification assigned by input guardrails. Untrusted until
            explicitly classified (SECURITY.md section 2).

    AIExecutionRequest:
      type: object
      required:
        - workload_type
        - business_priority
      properties:
        workload_type:
          type: string
          enum:
            - quality_check
            - predictive_maintenance
            - supply_chain
        workload_id:
          type: string
          description: >
            Identifies the specific workload record. Required for the
            workload_id telemetry field mandated by ARCHITECTURE.md section 15;
            workload_type alone is not unique within a department.
        business_priority:
          type: string
          enum: [LOW, NORMAL, HIGH, CRITICAL]
        plant_id:
          type: string
        department_id:
          type: string
        request_payload:
          type: object
          description: >
            Structured, size-limited workload input. Large binary inputs are
            passed by reference in input_refs, not inlined here.
        input_refs:
          type: array
          items:
            $ref: "#/components/schemas/InputRef"
        modality:
          type: string
          enum: [text, image, multimodal, structured]
        quality_requirement:
          type: number
          minimum: 0
          maximum: 1
        max_cost:
          type: number
          minimum: 0

    ExecutionPlan:
      type: object
      properties:
        workload_type:
          type: string
        complexity:
          type: string
          enum: [SIMPLE, MEDIUM, COMPLEX]
        selected_model_id:
          type: string
          description: models.id
        selected_agent_id:
          type: string
          description: agents.id
        estimated_cost:
          type: number
        max_context_tokens:
          type: integer
        max_tool_calls:
          type: integer
        routing_policy_version:
          type: integer
          description: routing_policies.version
        budget_status:
          type: string
          enum: [ALLOW, DOWNGRADE, REQUIRE_APPROVAL, BLOCK]
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]

    AIExecutionResponse:
      type: object
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        execution_plan:
          $ref: "#/components/schemas/ExecutionPlan"
        result:
          type: object
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            total_tokens:
              type: integer
        cost:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
            provenance:
              type: string
              enum: [ACTUAL, ESTIMATED, UNAVAILABLE]
        quality_score:
          type: number
          nullable: true

    ApprovalRequired:
      type: object
      properties:
        request_id:
          type: string
        approval_id:
          type: string
        status:
          type: string
          enum: [PENDING]
        reason:
          type: string
        execution_plan:
          $ref: "#/components/schemas/ExecutionPlan"

    CostSummary:
      type: object
      description: >
        Actual and estimated spend are reported separately and never summed into
        a single unlabelled figure (AI_DEVELOPMENT_RULES.md sections 41 and 42).
      properties:
        actual_cost:
          type: number
          description: Sum of cost_events with provenance = ACTUAL.
        estimated_cost:
          type: number
          description: Sum of cost_events with provenance = ESTIMATED.
        unavailable_cost_events:
          type: integer
          description: Count of events with provenance = UNAVAILABLE.
        currency:
          type: string
          description: Platform base currency used for aggregation.
        total_requests:
          type: integer
        total_tokens:
          type: integer
        average_cost_per_request:
          type: number
        budget_consumed_percent:
          type: number
        forecast_month_end_cost:
          type: number
          description: FORECAST value. Must be displayed as a forecast.

    CostBreakdownItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        actual_cost:
          type: number
        estimated_cost:
          type: number
        currency:
          type: string
        total_requests:
          type: integer
        total_tokens:
          type: integer

    CostBreakdown:
      type: object
      properties:
        dimension:
          type: string
          enum: [model, agent, plant]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CostBreakdownItem"

    CostTrendPoint:
      type: object
      properties:
        bucket_start:
          type: string
          format: date-time
        actual_cost:
          type: number
        estimated_cost:
          type: number
        currency:
          type: string
        total_requests:
          type: integer
        total_tokens:
          type: integer

    CostTrend:
      type: object
      properties:
        granularity:
          type: string
          enum: [hour, day, week, month]
        points:
          type: array
          items:
            $ref: "#/components/schemas/CostTrendPoint"

    Budget:
      type: object
      properties:
        id:
          type: string
        scope_type:
          type: string
          enum: [ENTERPRISE, TENANT, PLANT, DEPARTMENT, WORKLOAD, AGENT, MODEL]
        scope_id:
          type: string
        amount:
          type: number
        currency:
          type: string
        period:
          type: string
          enum: [DAILY, MONTHLY, QUARTERLY, ANNUAL]
        warning_threshold_percent:
          type: number
        critical_threshold_percent:
          type: number
        status:
          type: string

    BudgetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Budget"
        page:
          $ref: "#/components/schemas/PageInfo"

    BudgetCreate:
      type: object
      required:
        - scope_type
        - scope_id
        - amount
        - currency
        - period
      properties:
        scope_type:
          type: string
          enum: [ENTERPRISE, TENANT, PLANT, DEPARTMENT, WORKLOAD, AGENT, MODEL]
        scope_id:
          type: string
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          default: INR
        period:
          type: string
          enum: [DAILY, MONTHLY, QUARTERLY, ANNUAL]
        warning_threshold_percent:
          type: number
          default: 80
        critical_threshold_percent:
          type: number
          default: 95

    BudgetUpdate:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
        period:
          type: string
          enum: [DAILY, MONTHLY, QUARTERLY, ANNUAL]
        warning_threshold_percent:
          type: number
        critical_threshold_percent:
          type: number
        status:
          type: string
        reason:
          type: string
          description: Recorded on the audit event for this change.

    BudgetStatus:
      type: object
      properties:
        budget_id:
          type: string
        scope_type:
          type: string
        scope_id:
          type: string
        amount:
          type: number
        consumed_actual_cost:
          type: number
        consumed_estimated_cost:
          type: number
        consumed_percent:
          type: number
        currency:
          type: string
        threshold_state:
          type: string
          enum: [OK, WARNING, CRITICAL]

    BudgetStatusList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetStatus"
        page:
          $ref: "#/components/schemas/PageInfo"

    Forecast:
      type: object
      properties:
        id:
          type: string
        scope_type:
          type: string
        scope_id:
          type: string
        forecast_date:
          type: string
          format: date
        predicted_cost:
          type: number
        lower_bound:
          type: number
        upper_bound:
          type: number
        confidence:
          type: number
        forecast_model_name:
          type: string
          description: Forecasting algorithm. Unrelated to models.model_name.
        forecast_model_version:
          type: string
        provenance:
          type: string
          enum: [FORECAST]

    ForecastList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Forecast"
        page:
          $ref: "#/components/schemas/PageInfo"

    Anomaly:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        scope_type:
          type: string
        scope_id:
          type: string
        anomaly_type:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        expected_value:
          type: number
        actual_value:
          type: number
        deviation_percent:
          type: number
        reason:
          type: string
        status:
          type: string
        resolved_at:
          type: string
          format: date-time
          nullable: true

    AnomalyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Anomaly"
        page:
          $ref: "#/components/schemas/PageInfo"

    OptimizationRecommendation:
      type: object
      properties:
        id:
          type: string
        workload_id:
          type: string
        current_strategy:
          type: string
        recommended_strategy:
          type: string
        estimated_saving:
          type: number
        estimated_saving_percent:
          type: number
        quality_impact_percent:
          type: number
        latency_impact_percent:
          type: number
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        recommendation_reason:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, APPLIED, ROLLED_BACK]
        provenance:
          type: string
          enum: [ESTIMATED, SIMULATED]
          description: >
            Savings are never reported as realized results
            (AI_DEVELOPMENT_RULES.md section 42).
        applied_policy_id:
          type: string
          nullable: true
        superseded_policy_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
        rolled_back_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
          nullable: true

    OptimizationRecommendationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OptimizationRecommendation"
        page:
          $ref: "#/components/schemas/PageInfo"

    OptimizationAnalyzeRequest:
      type: object
      required:
        - workload_id
      properties:
        workload_id:
          type: string
        simulation_only:
          type: boolean
          default: true
        target_saving_percent:
          type: number
          minimum: 0
          maximum: 100

    OptimizationAnalyzeAccepted:
      type: object
      properties:
        request_id:
          type: string
        recommendation_id:
          type: string
          description: >
            Poll /optimization/recommendations for the completed analysis.
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL]

    OptimizationApplyRequest:
      type: object
      properties:
        activation_mode:
          type: string
          enum: [CANARY, FULL]
          default: CANARY
        canary_traffic_percent:
          type: number
          minimum: 0
          maximum: 100
        reason:
          type: string

    OptimizationApplyResult:
      type: object
      properties:
        recommendation_id:
          type: string
        status:
          type: string
          enum: [APPLIED]
        applied_policy_id:
          type: string
        applied_policy_version:
          type: integer
        superseded_policy_id:
          type: string
          nullable: true
        activation_mode:
          type: string
          enum: [CANARY, FULL]
        canary_traffic_percent:
          type: number
          nullable: true

    OptimizationRollbackRequest:
      type: object
      properties:
        reason:
          type: string

    OptimizationRollbackResult:
      type: object
      properties:
        recommendation_id:
          type: string
        status:
          type: string
          enum: [ROLLED_BACK]
        rolled_back_policy_id:
          type: string
        reactivated_policy_id:
          type: string
        reactivated_policy_version:
          type: integer

    Model:
      type: object
      properties:
        id:
          type: string
        model_name:
          type: string
        provider:
          type: string
        capability:
          type: string
          enum: [text, vision, multimodal, embedding, speech, coding, reasoning]
        modality:
          type: string
          enum: [text, image, multimodal, structured]
        input_cost:
          type: number
          nullable: true
        output_cost:
          type: number
          nullable: true
        cost_unit:
          type: string
          nullable: true
        max_context_tokens:
          type: integer
          nullable: true
        supports_vision:
          type: boolean
        supports_tools:
          type: boolean
        supports_structured_output:
          type: boolean
        supports_embeddings:
          type: boolean
        quality_score:
          type: number
          nullable: true
        latency_score:
          type: number
          nullable: true
        risk_level:
          type: string
          nullable: true
        enabled:
          type: boolean

    ModelList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        page:
          $ref: "#/components/schemas/PageInfo"

    ModelUpdate:
      type: object
      description: >
        Only configurable registry metadata may be changed. Cost and capability
        values are configuration, never inferred from the model name.
      properties:
        enabled:
          type: boolean
        input_cost:
          type: number
        output_cost:
          type: number
        cost_unit:
          type: string
        max_context_tokens:
          type: integer
        quality_score:
          type: number
        latency_score:
          type: number
        risk_level:
          type: string
        reason:
          type: string
          description: Recorded on the audit event and in model_registry_history.

    Workload:
      type: object
      properties:
        id:
          type: string
        plant_id:
          type: string
        department_id:
          type: string
        name:
          type: string
        workload_type:
          type: string
          enum: [quality_check, predictive_maintenance, supply_chain]
        description:
          type: string
          nullable: true
        business_priority:
          type: string
          enum: [LOW, NORMAL, HIGH, CRITICAL]
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string

    WorkloadList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workload"
        page:
          $ref: "#/components/schemas/PageInfo"

    Agent:
      type: object
      properties:
        id:
          type: string
        workload_id:
          type: string
        name:
          type: string
        agent_type:
          type: string
        description:
          type: string
          nullable: true
        default_model_id:
          type: string
          nullable: true
        status:
          type: string

    AgentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        page:
          $ref: "#/components/schemas/PageInfo"

    Plant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        status:
          type: string

    PlantList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plant"
        page:
          $ref: "#/components/schemas/PageInfo"

    Department:
      type: object
      properties:
        id:
          type: string
        plant_id:
          type: string
        name:
          type: string
        status:
          type: string

    DepartmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Department"
        page:
          $ref: "#/components/schemas/PageInfo"

    RoutingPolicy:
      type: object
      properties:
        id:
          type: string
        workload_type:
          type: string
          enum: [quality_check, predictive_maintenance, supply_chain]
        complexity:
          type: string
          enum: [SIMPLE, MEDIUM, COMPLEX]
        business_priority:
          type: string
          nullable: true
        selected_model_id:
          type: string
          nullable: true
        selected_agent_id:
          type: string
          nullable: true
        max_context_tokens:
          type: integer
          nullable: true
        max_tool_calls:
          type: integer
          nullable: true
        max_cost_per_request:
          type: number
          nullable: true
        max_total_tokens_per_request:
          type: integer
          nullable: true
        minimum_quality_score:
          type: number
          nullable: true
        risk_level:
          type: string
          nullable: true
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, CANARY, ACTIVE, SUPERSEDED, ROLLED_BACK]
        canary_traffic_percent:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        approved_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
          nullable: true

    RoutingPolicyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoutingPolicy"
        page:
          $ref: "#/components/schemas/PageInfo"

    Approval:
      type: object
      properties:
        id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        action:
          type: string
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        requested_by:
          type: string
          nullable: true
        approved_by:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        comments:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true

    ApprovalList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        page:
          $ref: "#/components/schemas/PageInfo"

    ApprovalDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        comments:
          type: string

    AuditEvent:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          nullable: true
        trace_id:
          type: string
          nullable: true
        tenant_id:
          type: string
        user_id:
          type: string
          nullable: true
        action:
          type: string
        resource_type:
          type: string
          nullable: true
        resource_id:
          type: string
          nullable: true
        before_state:
          type: string
          nullable: true
        after_state:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        approval_id:
          type: string
          nullable: true

    AuditEventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          $ref: "#/components/schemas/PageInfo"

  responses:

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authorization failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found or not visible to the caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PolicyConflict:
      description: Policy or budget prevents requested operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
